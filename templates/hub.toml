# 環境の herdr の構成。herdr-reset はこの通りに herdr を組み立てる。
# パスはすべて環境（hub-env の親ディレクトリ）からの相対パスで書く。

# 環境を置く herdr のセッション名。herdr-reset はこのセッションのペインで実行する。
session = "hub"

# hub-status が期限を読む TODO のファイル。既定は todo/data/active.md。
# todo_file = "todo/data/active.md"

# ── ワークスペース ──────────────────────────────────────────────
# [[workspace]] を書いた順に、herdr のサイドバーへ並ぶ。
#   label  ワークスペースの名前。herdr-reset <label> で、そのワークスペースだけを作り直せる
#   cwd    ワークスペースのディレクトリ。ペインは、ペインの cwd を書かなければここで開く
#   setup  タブとペインの定義の代わりに、このスクリプトで組み立てる（環境からの相対パス。tab とは同時に書けない）
#          スクリプトは cwd で実行され、label と同じ名前のワークスペースを作る。環境変数 HUB_ENV_DIR・HUB_WORKSPACE_LABEL が渡る
#          herdr-reset は、既存のワークスペースを閉じてから実行する
#          スクリプトが起動するエージェントに rules を渡すには、環境変数 HUB_CLAUDE_ARGS（シェル用に引用済み）を claude の引数に足す
#   agents setup が起動するエージェントの名前の一覧（省略可）。hub-check の照合に使う
#
# [[workspace.tab]] を書いた順に、タブが並ぶ。
#   label  タブの名前
#
# [[workspace.tab.pane]] を書いた順に、ペインを作る。1 つ目はタブを作ったときからあるペイン。
#   name   ペインの名前。後のペインの split.from で参照する
#   split  2 つ目以降のペインの作り方。{ from = "<分割元の name>", direction = "right" | "down", ratio = <分割元に残す割合> }
#   cwd    ペインを開くディレクトリ（省略可）。省略するとワークスペースの cwd。1 つ目のペインにも効く
#   run    ペインで実行するコマンド。ペインの cwd で実行される
#   agent  ペインで起動するエージェント。{ name = "<herdr 上の名前>", args = [<claude の引数>] }
#          name は herdr のセッションの中で一意

# hub-env は司令塔のワークスペース。どの環境でもこのまま使える。
[[workspace]]
label = "hub-env"
cwd = "hub-env"

[[workspace.tab]]
label = "Claude"

[[workspace.tab.pane]]
name = "claude"
agent = { name = "hub" }

[[workspace.tab]]
label = "Shell"

# ── 例: 子リポジトリのワークスペース ─────────────────────────────
# 以下は、作者の手元の todo リポジトリ（scripts/todo-view などを持つ）を前提にした例。
# このままでは動かないので、自分の子リポジトリに合わせて書き換え、コメントを外して使う。
# 子リポジトリごとに [[workspace]] を 1 つ足す。要らなければ消してよい。
#
# todo リポジトリの組み立てスクリプトを使うなら、次の 4 行だけでよい（下のタブ定義は要らない）。
# [[workspace]]
# label = "todo"
# cwd = "todo"
# setup = "todo/contrib/herdr/todo-herdr"
# agents = ["todo"]
#
# スクリプトを使わず、ペインを定義するなら次のように書く。
# [[workspace]]
# label = "todo"
# cwd = "todo"
#
# [[workspace.tab]]
# label = "ToDo"
#
# [[workspace.tab.pane]]
# name = "view"
# run = "scripts/todo-view data/active.md"
#
# [[workspace.tab.pane]]
# name = "claude"
# split = { from = "view", direction = "right", ratio = 0.55 }
# agent = { name = "todo", args = ["--agent", "todo"] }
#
# [[workspace.tab.pane]]
# name = "notes"
# split = { from = "view", direction = "down", ratio = 0.43 }
# cwd = "todo/data/notes"
# run = "../../scripts/todo-notes"
